name = "vidioma-supabase-keepalive"
main = "src/worker.js"
compatibility_date = "2026-07-01"

# Free tier: cron triggers are included, and this runs ~180 times a month
# against an allowance of 100k invocations a day.
workers_dev = true

[vars]
# Your deployed backend's base URL, e.g. https://vidioma-backend.onrender.com.
# Plain [vars] rather than a secret because this is a public URL, not a
# credential -- the backend holds the Supabase service key, this Worker holds
# nothing. Edit this value before deploying.
BACKEND_URL = "https://vidioma.onrender.com"

[triggers]
# Every 4 hours, because the threshold is a DAILY one: Supabase counts a Free
# project inactive on "too few user queries" in the past week and says "a few
# user requests to the database each day over the previous week" is enough.
# Every-2-days left 5 of every 7 days with zero activity, which is what got the
# project flagged twice (see README).
#
# 6 ticks a day is 12 DB requests a day with six independent chances, so a
# single failed tick never costs a day. The odd minute avoids the top-of-hour
# spike when Cloudflare schedules the most crons, which is when a run is most
# likely to be delayed.
crons = ["12 */4 * * *"]
