[pytest]
# Only collect real unit tests. Without this, pytest auto-discovers helper
# scripts (e.g. smoke_api.py) and, if any run I/O at import, breaks collection.
python_files = test_*.py
testpaths = .

# --strict-markers is the one that prevents a silent pass: a typo'd
# @pytest.mark.skipif otherwise becomes an unknown marker, and the test is
# quietly skipped instead of failing. --strict-config does the same for a
# malformed setting in this file.
addopts = -q --strict-markers --strict-config

# An xfail that starts passing should fail, so a fixed bug can't stay marked
# broken forever.
xfail_strict = true
