name: CI

# Runs both test suites + the frontend production build on every push and PR.
# The app auto-deploys from main (Render / static host), so this is the gate
# that keeps a broken commit from reaching production.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: backend
        # Rate-limiter tests use in-memory storage (no Redis service needed);
        # Redis/Supabase are optional at runtime and absent here by design.
        run: python -m pytest -q

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm test -- --watchAll=false
        env:
          CI: true
      - name: Production build
        working-directory: frontend
        run: npm run build
        env:
          CI: true
