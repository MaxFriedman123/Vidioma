name: CI

# Runs both test suites + the frontend production build on every push and PR.
# The app auto-deploys from main (Render / static host), so this is the gate
# that keeps a broken commit from reaching production.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The default GITHUB_TOKEN is write-scoped; nothing here needs to write, and a
# compromised transitive dev dependency would otherwise run with push rights.
permissions:
  contents: read

# Pushing twice to a branch should not run both to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # Rules are scoped to bug-finders (pyflakes + bugbear + import order), not
      # style, so a failure here means something is actually wrong.
      - name: Ruff lint
        working-directory: backend
        run: ruff check .
      # Both Workers deploy to production and are otherwise never validated by
      # CI. A malformed keepalive Worker means Supabase silently pauses.
      - name: Syntax-check the Cloudflare Workers
        run: |
          node --check cloudflare-worker/src/worker.js
          node --check cloudflare-worker-keepalive/src/worker.js

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Read from backend/.python-version so CI and local cannot drift.
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: backend
        # Rate-limiter tests use in-memory storage (no Redis service needed);
        # Redis/Supabase are optional at runtime and absent here by design.
        run: python -m pytest -q

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Read from frontend/.nvmrc so CI and local cannot drift.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        # npm ci enforces an exact lockfile match. The lockfile is regenerated on
        # macOS (includes the darwin-only optional dep fsevents); npm resolves
        # optional deps per-platform, so a Linux runner install stays in sync.
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm test -- --watchAll=false
        env:
          CI: true
      - name: Production build
        working-directory: frontend
        run: npm run build
        env:
          CI: true
