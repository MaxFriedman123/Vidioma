<!--
  Vidioma app icon: a "V" monogram in the brand cyan on the app's slate
  background. Master artwork for favicon.ico, logo192.png and logo512.png (see
  scripts/generate-icons.sh) and usable directly by browsers that prefer SVG.

  Drawn as a filled path rather than text so it renders identically everywhere
  without depending on a font being installed, and stays legible at 16px.

  Colours match the running app: #7dd3e8 is the navbar wordmark / GO button cyan
  and #2b2d35 is the page background.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Vidioma">
  <!-- Rounded-square tile. 22% corner radius sits close to the iOS/Android mask,
       so the shape still reads correctly once the OS clips it. -->
  <rect width="512" height="512" rx="112" ry="112" fill="#2b2d35"/>
  <!-- The V. Strokes are thick and the apex is slightly flattened so it survives
       downscaling to 16px instead of degrading into a thin grey smudge. -->
  <path
    fill="#7dd3e8"
    d="M136 132h58l62 168 62-168h58l-92 248h-56z"/>
</svg>
