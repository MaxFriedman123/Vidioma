<!--
  Maskable variant of the app icon (see logo.svg for the standard one).

  Android applies its own mask to installed-app icons, which can be a circle, a
  squircle, or a teardrop depending on the launcher, and it crops anything
  outside the middle 80%. The standard icon's V nearly fills the tile, so its
  arms would be clipped. Here the background is full-bleed (no rounded corners,
  since the OS supplies the shape) and the V is scaled down to sit inside the
  safe zone.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Vidioma">
  <rect width="512" height="512" fill="#2b2d35"/>
  <!-- Same path as logo.svg, scaled to ~72% about the centre so the whole glyph
       stays within the 80% safe zone whatever mask the launcher applies. -->
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <path fill="#7dd3e8" d="M136 132h58l62 168 62-168h58l-92 248h-56z"/>
  </g>
</svg>
